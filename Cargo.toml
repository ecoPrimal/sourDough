[workspace]
resolver = "2"
members = [
    "crates/sourdough",
    "crates/sourdough-core",
    "crates/sourdough-genomebin",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/sourDough"
authors = ["ecoPrimals Project"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
# Canonical ecosystem types (cellMembrane agglutinated forms)
cellmembrane-types = { path = "../../gardens/cellMembrane/crates/cellmembrane-types" }

# Async runtime — per-crate feature selection for compile time
tokio = { version = "1.40", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
blake3 = { version = "1.5", default-features = false, features = ["pure"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Wire format (zero-copy RPC request/response)
bytes = { version = "1.11", features = ["serde"] }
serde_bytes = "0.11"

# Binary RPC (cephalization — G64 dual-protocol)
tarpc = { version = "0.37", features = ["tokio1", "serde-transport", "serde-transport-bincode", "unix"] }
tokio-serde = { version = "0.9", features = ["bincode"] }

# Genome bin (archives, paths, testing)
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
tempfile = "3.13"
proptest = "1.6"
