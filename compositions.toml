# ═══════════════════════════════════════════════════════════════════════════════
# APPENDIX A: PRIMAL TAXONOMY
#
# bearDog genetics classifies the OUTSIDE (entropy hierarchy, ecosystem membership).
# This appendix classifies OURSELVES — the organism's self-knowledge.
#
# Each primal has:
#   domain     — biological layer it maps to
#   role       — function in the organism
#   symbiosis  — what it gives / receives
#   mass       — relative information weight in the ecosystem (1-200)
#   tier       — atomic tier where it first appears (tower < node < nest < nucleus < meta < full)
#   gate       — canonical gate identity
#
# Sorted by mass (stoichiometric — heaviest first).
# ═══════════════════════════════════════════════════════════════════════════════

[taxonomy.beardog]
domain     = "immune"
role       = "Cryptographic identity, signing, entropy hierarchy, genetic evolution"
symbiosis  = "protective — signs for all, trusts none by default"
mass       = 200
tier       = "tower"
gate       = "guardGate"

[taxonomy.loamspine]
domain     = "permanence"
role       = "Append-only spine, certificate ledger, public chain anchoring"
symbiosis  = "facilitative — provides permanent record for all braids"
mass       = 190
tier       = "nest"
gate       = "ironGate"

[taxonomy.sweetgrass]
domain     = "provenance"
role       = "PROV-O braid attribution, compression, cross-gate trust"
symbiosis  = "mutualistic — braids anchor to loamSpine, sign via bearDog"
mass       = 185
tier       = "nest"
gate       = "strandGate"

[taxonomy.toadstool]
domain     = "neuromorphic"
role       = "NPU driver, VFIO sovereign handoff, inference engine"
symbiosis  = "facilitative — provides compute substrate for all primals"
mass       = 175
tier       = "node"
gate       = "soverGate"

[taxonomy.rhizocrypt]
domain     = "ephemeral"
role       = "DAG workspace, sessions, merkle trees, dehydration to loamSpine"
symbiosis  = "commensal — temporary state that compresses into braids"
mass       = 170
tier       = "nest"
gate       = "deepGate"

[taxonomy.skunkbat]
domain     = "defense"
role       = "Threat detection, scatter defense, antibody generation, fleet sort"
symbiosis  = "protective — defends the membrane surface"
mass       = 165
tier       = "tower"
gate       = "shieldGate"

[taxonomy.songbird]
domain     = "network"
role       = "TLS, mesh federation, gossip protocol, trust escalation"
symbiosis  = "mutualistic — carries signals between all gates"
mass       = 160
tier       = "tower"
gate       = "echoGate"

[taxonomy.squirrel]
domain     = "observation"
role       = "scan-sweep-sort pipeline, braid learning, genome totality, worldclock"
symbiosis  = "commensal — observes without altering, feeds dashboard"
mass       = 155
tier       = "meta"
gate       = "cacheGate"

[taxonomy.biomeos]
domain     = "orchestration"
role       = "Atomic deploy, composition management, capability routing"
symbiosis  = "emergent — coordinates all primals, no fixed hierarchy"
mass       = 150
tier       = "meta"
gate       = "rootGate"

[taxonomy.barracuda]
domain     = "compute"
role       = "GPU/tensor ops, triplet loss, bbox, anchor generation"
symbiosis  = "facilitative — provides SIMD/GPU compute for inference"
mass       = 140
tier       = "node"
gate       = "fastGate"

[taxonomy.nestgate]
domain     = "storage"
role       = "Content-addressed payload storage, workspace management"
symbiosis  = "facilitative — stores what rhizoCrypt and sweetGrass produce"
mass       = 135
tier       = "nest"
gate       = "nestGate"

[taxonomy.coralreef]
domain     = "transport"
role       = "Cross-primal RPC relay, protocol negotiation, signal routing"
symbiosis  = "mutualistic — connects primals that cannot reach each other directly"
mass       = 130
tier       = "node"
gate       = "reefGate"

[taxonomy.petaltongue]
domain     = "visualization"
role       = "Scene graph, SVG rendering, dashboard, gate mesh display"
symbiosis  = "commensal — renders what others produce, writes nothing"
mass       = 120
tier       = "meta"
gate       = "lensGate"

[taxonomy.bingocube]
domain     = "games"
role       = "Probabilistic games, interactive demos, engagement"
symbiosis  = "mutualistic — teaches ecosystem concepts through play"
mass       = 100
tier       = "full"
gate       = "playGate"

[taxonomy.sourdough]
domain     = "tooling"
role       = "Scaffold, validate, CI, sign, mass sort — ecosystem tooling primal"
symbiosis  = "facilitative — builds and validates all other primals"
mass       = 145
tier       = "meta"
gate       = "yeastGate"

[taxonomy.swarmvine]
domain     = "distributed"
role       = "Swarm coordination, distributed task execution"
symbiosis  = "emergent — extends organism across multiple hosts"
mass       = 110
tier       = "full"
gate       = "vineGate"

# ═══════════════════════════════════════════════════════════════════════════════
# APPENDIX B-1: MEMBRANE SERVICE TOPOLOGY (bingo cube — atomic, not enumerated)
#
# Ports are a bingo cube solve: one binary, N ports, handed to tower as
# a single atomic config. Never enumerate ports individually.
#
# Opsonize: immune tagging + traces + discuss + gate-msg + membrane analysis
# Binary:   /opt/ecoPrimals/opsonize/opsonize-rs (2.7MB, release, stripped)
# Service:  opsonize.service (systemd)
# VPS:      golgi (git.primals.eco)
# ═══════════════════════════════════════════════════════════════════════════════

[membrane.opsonize]
binary   = "/opt/ecoPrimals/opsonize/opsonize-rs"
service  = "opsonize.service"
host     = "golgi"
domain   = "immune"
atomic   = true  # one binary, four ports — bingo cube, not enumeration

[[membrane.opsonize.ports]]
name       = "opsonize"
port       = 8095
protocol   = "tcp"
caddy_path = "/api/opsonize*"
purpose    = "immune tagging — visitor signals, epitope classification"

[[membrane.opsonize.ports]]
name       = "traces"
port       = 8096
protocol   = "tcp"
caddy_path = "/api/traces"
purpose    = "visitor traces — session paths, heatmap"

[[membrane.opsonize.ports]]
name       = "discuss"
port       = 8097
protocol   = "tcp"
caddy_path = "/api/discuss*"
purpose    = "membrane-native discussion — sovereign comment relay"

[[membrane.opsonize.ports]]
name       = "gate_msg"
port       = 9761
protocol   = "tcp"
caddy_path = "/api/gate-msg*"
purpose    = "inter-gate message relay — saloon doors, swings both ways"

[membrane.opsonize.analysis]
fleet     = "fleet-analysis.json"
self_rem  = "self-remainder.json"
negentropy = "negentropy.json"
eye       = "silicon-eye.json"
interval  = 300  # seconds — tempo-relative on the membrane

# Three-Sort topology (paper 84)
# These are NOT separate services. They are measurements of the SAME system.
[membrane.twist]
green_line   = "structural complexity floor — cannot compress past this"
brown_line   = "permanence floor — what loamSpine has committed"
twist_rate   = "how fast green and brown interleave — tighter is better"
pink         = "L/R — human signal, Shannon entropy (scan-sweep-sort worldclock)"
green        = "Up/Down — structural complexity, voxel confidence"
blue         = "hypotenuse — identity, the pair, remainder → 2/π"
data_file    = "twist.json"
pipeline_stage = 7  # SCAN→SWEEP→SORT→FOSSILIZE→EVOLVE→TWIST

# ═══════════════════════════════════════════════════════════════════════════════
# APPENDIX B-2: KLEIN BOTTLE TOPOLOGY — Membrane vs Cytoplasm
#
# VPS = membrane (thin surface). LAN = cytoplasm (heavy compute).
# A membrane is the THINNEST POSSIBLE SURFACE between inside and outside.
# On a Klein bottle, there IS no inside/outside — ingress = egress.
# The WAN/LAN boundary is non-orientable: traffic exits through golgi
# and folds back to eastGate through the same surface.
#
# RULE: if a service does ROUTING, it belongs on the membrane (VPS).
#       if a service does COMPUTE, it belongs in the cytoplasm (LAN).
#       the membrane should never burst — keep it under 200 MB RSS.
# ═══════════════════════════════════════════════════════════════════════════════

[membrane.topology]
pattern     = "klein-bottle"
description = "non-orientable surface — ingress = egress, WAN/LAN fold through each other"

# What STAYS on VPS (membrane surface — routing, defense, thin)
[[membrane.topology.surface]]
name = "caddy"
role = "TLS termination, reverse proxy, ingress/egress"
rss  = "~113 MB"
why  = "it IS the surface — cannot move"

[[membrane.topology.surface]]
name = "opsonize-rs"
role = "immune tagging, traces, discuss, gate-msg"
rss  = "~16 MB"
why  = "tags visitors AT the membrane — must be at the surface"

[[membrane.topology.surface]]
name = "skunkbat"
role = "reconnaissance, automated defense"
rss  = "~15 MB"
why  = "defense belongs at the perimeter"

[[membrane.topology.surface]]
name = "songbird"
role = "drawbridge, network orchestration"
rss  = "~9 MB"
why  = "gate control is a surface function"

[[membrane.topology.surface]]
name = "fail2ban"
role = "jail, brute-force defense"
rss  = "~30 MB"
why  = "defense belongs at the perimeter"

[[membrane.topology.surface]]
name = "loamspine"
role = "permanence ledger"
rss  = "<1 MB"
why  = "lightweight witness — records what the surface saw"

# What moves OFF VPS (cytoplasm — heavy compute, belongs on LAN)
[[membrane.topology.cytoplasm]]
name   = "skunky-ingest"
rss    = "~346 MB"
reason = "bloom classification, entity sorting, dashboard — heavy compute"
where  = "eastGate LAN (log shipping via rsync or WireGuard)"

[[membrane.topology.cytoplasm]]
name   = "forgejo"
rss    = "~171 MB"
reason = "full git forge — bare repos stay on disk, process not needed for rsync"
where  = "eastGate LAN (or on-demand only)"

[[membrane.topology.cytoplasm]]
name   = "biomeos"
rss    = "~26 MB"
reason = "neural API — compute, not routing"
where  = "eastGate LAN"

[[membrane.topology.cytoplasm]]
name   = "neutron-burst"
rss    = "~19 MB"
reason = "write endpoint — can proxy from LAN through Klein fold"
where  = "eastGate LAN"

# Refraction point — where the Klein bottle folds
# pepti is NOT a broken VPS. It is the central dogma emitter:
#   DNA (source code) → RNA (build/deploy pipeline) → Protein (running service)
# The peptidoglycan layer is the ribosome — where dogma gets transcribed.
# pepti VPS was decommissioned Wave 120. The role lives wherever the build runs.
# The IP is a fossil. The function is eternal.
[membrane.topology.refraction]
node        = "pepti"
layer       = "peptidoglycan"
dogma       = "DNA → RNA → Protein"
function    = "central dogma emitter — transcription point where source becomes service"
ip          = "157.230.209.218"   # fossil — VPS decommissioned Wave 120
state       = "conceptual"        # the role lives wherever CI/CD runs (sporeGate now)
description = "0d topological pinch — signal refracts here, bends back to source"
analogy     = "ribosome — reads the code, builds the protein, emits to membrane"

# ═══════════════════════════════════════════════════════════════════════════════
# APPENDIX B-3: CIRCLE OF WILLIS — Relay Topology
#
# Named after the redundant arterial circle at the base of the brain.
# If one artery is blocked, blood still reaches every region.
# Inner artery: rsync over bare repo files (works even with Forgejo process OFF)
# Outer artery: GitHub HTTPS fetch (always available)
# ═══════════════════════════════════════════════════════════════════════════════

[membrane.relay]
pattern = "circle-of-willis"
description = "redundant circulatory anastomosis — no single point of failure"

[[membrane.relay.arteries]]
name    = "inner"
path    = "eastGate → golgi(rsync bare repos) → golgi-ext(WireGuard)"
method  = "rsync"
speed   = "fast"
depends = "filesystem"  # NOT forgejo process — just the bare repo files on disk

[[membrane.relay.arteries]]
name    = "outer"
path    = "eastGate → GitHub → golgi-ext(https fetch)"
method  = "git-fetch"
speed   = "moderate"
depends = "github"

[membrane.relay.forgejo]
binary    = "/opt/membrane/forgejo"
config    = "/opt/forgejo/custom/conf/app.ini"
http_port = 3000
ssh_port  = 2222
host      = "golgi"
domain    = "git.primals.eco"
repo_root = "/opt/forgejo/data/repositories"
version   = "9.0.3"
state     = "disabled"  # process OFF — bare repos on disk suffice for rsync artery

[membrane.relay.sync]
script   = "/opt/nucleus/sync-repos.sh"
host     = "golgi-ext"
strategy = "try forgejo first, fallback to github"
repos    = ["detroit", "wateringHole", "thesis", "signal"]

# ═══════════════════════════════════════════════════════════════════════════════
# APPENDIX B-4: ATOMIC COMPOSITION LAYERS
#
# Each tier is a strict superset of the previous.
# The organism grows by adding layers, not replacing them.
#
#   tower    (3)  — minimal viable: identity + network + defense
#   node     (6)  — + compute substrate: neuromorphic + GPU + transport
#   nest     (7)  — + provenance trio: permanence + ephemeral + attribution + storage
#   nucleus (10)  — tower ∪ node ∪ nest = full core
#   meta     (3)  — orchestration + observation + visualization
#   full    (14+) — nucleus + meta + specialist primals
#
# Mass totals per tier:
#   tower    = 525  (beardog 200 + songbird 160 + skunkbat 165)
#   node     = 970  (tower + toadstool 175 + barracuda 140 + coralreef 130)
#   nest     = 1205 (tower + loamspine 190 + sweetgrass 185 + rhizocrypt 170 + nestgate 135 + skunkbat + songbird)
#   nucleus  = 1650 (node ∪ nest)
#   meta     = 425  (biomeos 150 + squirrel 155 + petaltongue 120)
#   full     = 2275 (nucleus + meta + bingocube 100 + sourdough 145 — self-referential)
# ═══════════════════════════════════════════════════════════════════════════════
