# ═══════════════════════════════════════════════════════════════════════════════
# APPENDIX B-3: GREEN LINE — META-IRREDUCIBILITY LADDER (HUD module sort)
#
# Wave 178: 97 HUD JS modules sorted by the green line.
# Each layer EMERGES from the one below but is IRREDUCIBLE to it.
# You cannot derive biology from chemistry alone (Polanyi's tacit dimension).
# You cannot derive consent from neurons alone (Kant's categories).
# You cannot falsify a research programme's hard core (Lakatos/Vienna).
#
# The green line is: math → physics → chemistry → biology → Kant → Lakatos
#
# Each layer is loaded as an overlay in water.html. They stack.
# At each level of meta-irreducibility, the sort re-applies:
# the bingo voxel compresses through the layer, and what survives
# is the irreducible residue — the research programme's hard core.
#
#   LAYER  NAME                   MODULES  KB       WHAT
#   ─────  ─────────────────────  ───────  ───────  ─────────────────────────────
#   L0     math                   11       155.7    π, topology, compression, sort
#   L1     physics                25       592.5    waves, signals, spacetime, membrane
#   L2     chemistry              12       324.5    bonding, equilibration, mixing
#   L3     biology                22       447.6    metabolism, ecology, epitopes, fleet
#   L4     philosophy (Kant)      14       493.8    consent, identity, observation
#   L5     research (Lakatos)     13       202.3    programmes, totality, falsification
#   ─────  ─────────────────────  ───────  ───────
#   TOTAL                         97       2216.4KB
#
# Why these layers and not others:
#
# L0 MATH: numbers are irreducible. π is irrational — it cannot be compressed
#   further. The bingo cube IS math: voxel coordinates, Shannon entropy,
#   compression ratio. Foundation.
#
# L1 PHYSICS: waves, fields, signals EMERGE from math but add causation.
#   Math describes; physics constrains. The membrane IS a physical surface.
#   25 modules — the largest layer because the membrane IS physics.
#
# L2 CHEMISTRY: bonding is irreducible to forces. Equilibration IS chemistry.
#   The HUD equilibrates, stacks, mixes — these are chemical operations
#   performed on information. Periodic spiral → Mendeleev IS here.
#
# L3 BIOLOGY: living systems are irreducible to chemistry (Polanyi, Rosen).
#   The chipmunk IS biology — metabolism, learning, gaze, ecology.
#   Epitopes, fleet behavior, scatter — immune system operations.
#   22 modules — the chipmunk-* family IS the organism.
#
# L4 PHILOSOPHY (Kant): the observer IS irreducible to the observed.
#   Kant's categories of understanding: consent, identity, presence,
#   the "you-are-here" that no physics can derive. Chipmunk-dialogue,
#   consent-inversion, human-surround — these are not biology.
#   They are what the observer brings to the observation.
