[package]
name = "sourdough"
description = "The reference UniBin for ecoPrimals - tooling and scaffolding platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sourdough"
path = "src/main.rs"

[dependencies]
# Core library
sourdough-core = { path = "../sourdough-core" }

# CLI
clap = { version = "4.6", features = ["derive", "cargo", "wrap_help"] }

# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Hashing (content-addressed identity)
blake3 = { workspace = true }

# genomeBin + signing
sourdough-genomebin = { path = "../sourdough-genomebin" }
ed25519-dalek = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = "2.2"
predicates = "3.1"

