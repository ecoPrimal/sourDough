[package]
name = "sourdough-core"
description = "Core traits and patterns for ecoPrimals - the starter culture for new primals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Canonical ecosystem types
cellmembrane-types = { workspace = true }

# Async
tokio = { workspace = true, features = ["io-util", "net", "time", "rt", "signal"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
serde_bytes = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Cryptography
blake3 = { workspace = true }

# Binary RPC (G64 Cephalization — canonical tarpc service trait)
tarpc = { workspace = true }
tokio-serde = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "time", "rt", "rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
proptest = { workspace = true }

